name: E2E & API tests

# Runs the safe default suite (tests/e2e minus @otp, plus tests/api) against
# dev-nx.thekanaa.com — a shared dev/staging environment. README.md documents it
# getting flaky under repeated back-to-back automated runs, so this intentionally
# does NOT trigger on every push/PR: a daily schedule plus an on-demand manual
# trigger, with concurrency guarding against overlapping runs stacking up.
#
# The @otp-tagged login/checkout tests and the homepage QA bot suite
# (tests/homepage) are out of scope here on purpose — see README.md and CLAUDE.md.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: e2e-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run install:browsers

      - name: Run tests/e2e (excluding @otp) + tests/api
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
